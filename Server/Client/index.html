<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Sharing Web App</title>
    <!-- Link to your custom CSS file -->
    <link href="styles/style.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Simple Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">File Sharing</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="#">Upload</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact Us</a></li>
            </ul>
        </div>
    </nav>

    <!-- Upload Form -->
    <div class="container mt-5">
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Choose a .txt file to upload</label>
                <input type="file" class="form-control" id="file" name="file" accept=".txt" required>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Upload</button>
        </form>
        <div id="uploadStatus" class="mt-3"></div>
    </div>

    <!-- View Button -->
    <button id="viewFilesBtn" class="btn btn-secondary mt-3">View Uploaded Files</button>

    <!-- List of uploaded files -->
    <div id="uploadedFilesList" class="mt-3"></div>

    <script src="scripts/uploadForm.js"></script>
</body>
</html>
